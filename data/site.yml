# ---------------------------------------------------------------------------
# Main settings for one edition. Start here.
#
# Dates: YYYY-MM-DD. Leave a date empty and the site shows "TBC".
# Times: "HH:MM" in quotes.
# ---------------------------------------------------------------------------

event:
  short_name: VIBE                                  # the big word in the logo
  full_name: Virtual Institute of Bioinformatics and Evolution   # the two-line subtitle
  edition: "20XX"
  title: VIBE 20XX                                  # browser tab and social card
  start_date:                  # YYYY-MM-DD
  end_date:                    # YYYY-MM-DD
  start_time: "09:00"          # first session on day one (used by the countdown)
  end_time: "17:00"            # last session on the final day
  utc_offset: "+01:00"         # "+01:00" Irish summer time, "+00:00" winter
  timezone_label: local time
  venue: Venue name
  city: City, Country
  contact_email: contact@example.org

# The institution hosting this edition. The host changes every year.
host:
  name: Host Institution
  url: https://example.org

# Banner saying the content is placeholder. Set to false when ready.
demo_notice: true

# Pages to build, in menu order. Delete a line to remove that page.
#   nav: header → top menu, nav: footer → footer only
pages:
  - { slug: programme, label: Programme, nav: header }
  - { slug: speakers, label: Speakers, nav: header }
  - { slug: call-for-abstracts, label: Call for abstracts, nav: header }
  - { slug: key-dates, label: Key dates, nav: header }
  - { slug: committees, label: Committees, nav: header }
  - { slug: venue, label: Venue, nav: header }
  - { slug: register, label: Register, nav: footer }
  - { slug: about, label: About, nav: footer }
  - { slug: sponsors, label: Sponsors, nav: footer }
  - { slug: faq, label: FAQ, nav: footer }
  - { slug: code-of-conduct, label: Code of conduct, nav: footer }

registration:
  opens:                       # date
  closes:                      # date
  url: https://example.org     # external registration form
  button_label: Register
  fees:
    - { category: Standard, fee: "€ —" }
    - { category: Student, fee: "€ —" }

abstracts:
  opens:                       # date
  deadline:                    # date
  notification:                # date
  url: https://example.org     # external submission system
  button_label: Submit an abstract
  topics:
    - Topic 1
    - Topic 2
    - Topic 3
  formats:
    - { name: Oral presentation }
    - { name: Poster }

social:
  - { label: LinkedIn, url: https://www.linkedin.com/ }
