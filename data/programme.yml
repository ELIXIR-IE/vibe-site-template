# Programme, one block per day. Copy the block for more days.
#
#   date:     YYYY-MM-DD (leave empty until known)
#   sessions: start/end "HH:MM", type, title
#   type:     keynote | talks | panel | workshop | posters | break | social | opening
#   speaker:  optional speaker id from speakers.yml (keynotes)
#   chair:    optional
#   items:    optional talks: { title, by } ("by" is text or a speaker id)
- date:
  sessions:
    - { start: "09:00", end: "09:15", type: opening, title: Opening }
    - { start: "09:15", end: "10:00", type: keynote, title: Talk title, speaker: keynote-1 }
    - start: "10:00"
      end: "11:00"
      type: talks
      title: Session 1
      chair: Chair Name
      items:
        - { title: Talk title, by: "Presenter Name, Affiliation" }
        - { title: Talk title, by: "Presenter Name, Affiliation" }
    - { start: "11:00", end: "11:30", type: break, title: Break }
    - { start: "11:30", end: "12:30", type: posters, title: Poster session }
    - { start: "12:30", end: "12:45", type: opening, title: Closing }
