# Frequently asked questions. Answers can use Markdown links: [text](https://...)
- q: Does it cost anything to attend?
  a: No. Registration is free for everyone, but you do need to register to receive the joining links.
- q: Which platform do you use?
  a: Talks are streamed through a video meeting platform, and the poster hall and chat run in a separate community space. Links arrive by email a few days before the event.
- q: Will sessions be recorded?
  a: Keynotes and contributed talks are recorded when the speaker agrees. Workshops and the poster hall are not recorded.
- q: Can I present if I am not based in Ireland?
  a: Yes. Anyone can submit an abstract. The programme gives priority to work with a connection to the Irish bioinformatics community.
- q: I need an accessibility adjustment. Who do I contact?
  a: Email the organisers at the address below. Live captions are on for all streamed sessions.
- q: How do I get a certificate of attendance?
  a: Tick the box on the feedback form after the event and we will email a certificate within two weeks.
