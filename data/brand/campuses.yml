# Institutions shown as coral wells in the logo (the "flow cell island").
#
# Each campus lights the well nearest to it on the map, so campuses in the
# same city share a well. Add, remove or edit entries here, then push: the
# logo files in public/logo/ and the favicons are rebuilt on every build.
#
# Coordinates are decimal degrees (lat north, lon east; Ireland has negative lon).
# Northern Ireland institutions work the same way; the map covers the whole island.

