name: Check pull request

# Builds the site for every pull request, so data mistakes are caught
# before they reach main. Nothing is published.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Check data and build
        run: npm run build
      - name: Type check
        run: npm run check
